<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام حضور وغياب الطلاب الذكي - Attendance QR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4338ca">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%);
      color: white;
      text-align: center;
    }
    .splash-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem 2rem;
      border-radius: var(--radius-xl);
      max-width: 440px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .splash-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, var(--accent-gold-500) 0%, var(--accent-gold-600) 100%);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #1e1b4b;
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.5);
    }
    .splash-title {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    .splash-subtitle {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-logo">
      <i class="fa-solid fa-qrcode"></i>
    </div>
    <h1 class="splash-title">Attendance QR</h1>
    <p class="splash-subtitle">نظام إدارة حضور وغياب الطلاب الذكي بالكارنيه</p>
    <div class="spinner spinner-primary" style="margin: 0 auto; width: 36px; height: 36px; border-top-color: #fbbf24;"></div>
  </div>

  <script type="module">
    import { getCurrentUser } from "./js/auth.js";
    // Check if user is logged in and route accordingly
    setTimeout(() => {
      const user = getCurrentUser();
      if (user) {
        window.location.replace("dashboard.html");
      } else {
        window.location.replace("login.html");
      }
    }, 600);
  </script>
</body>
</html>
