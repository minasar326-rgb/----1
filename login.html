<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول المسؤول - Attendance QR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4338ca">
  <!-- HTML5 QR Code Library (Local First + CDN Fallback) -->
  <script src="js/html5-qrcode.min.js"></script>
  <script>
    if (typeof Html5Qrcode === "undefined") {
      document.write('<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\\/script>');
    }
  </script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #0f172a 100%);
      padding: 1.5rem;
      position: relative;
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      animation: popIn 0.35s ease-out;
    }

    .login-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-800) 100%);
      color: var(--accent-gold-400);
      border-radius: var(--radius-lg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-primary);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .password-toggle {
      position: absolute;
      left: 0.875rem;
      color: var(--text-subtle);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem;
    }

    .demo-hint {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: var(--primary-50);
      border: 1px dashed var(--primary-300);
      border-radius: var(--radius-md);
      font-size: 0.825rem;
      color: var(--primary-800);
      line-height: 1.5;
    }

    @keyframes loginLaserScan {
      0% { top: 12%; opacity: 0.3; }
      50% { top: 88%; opacity: 1; }
      100% { top: 12%; opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <i class="fa-solid fa-cross"></i>
      </div>
      <h1 class="login-title">تسجيل الدخول</h1>
      <p class="login-subtitle">نظام حضور وغياب الطلاب بالكارنيه الذكي</p>
    </div>

    <!-- 1. Email & Password Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">
          <i class="fa-solid fa-envelope text-primary"></i> البريد الإلكتروني
        </label>
        <div class="input-with-icon">
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="admin@marinachurch.org" 
            value="admin@marinachurch.org" 
            required 
            autocomplete="email"
          >
          <i class="fa-solid fa-at input-icon"></i>
        </div>
      </div>

      <div class="form-group" style="position: relative;">
        <label class="form-label" for="login-password">
          <i class="fa-solid fa-lock text-primary"></i> كلمة المرور
        </label>
        <div class="input-with-icon" style="position: relative;">
          <input 
            type="password" 
            id="login-password" 
            class="form-control" 
            placeholder="••••••••" 
            value="M@rina2026" 
            required 
            autocomplete="current-password"
          >
          <i class="fa-solid fa-eye password-toggle" id="toggle-password" title="إظهار / إخفاء كلمة المرور"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full btn-lg" id="submit-btn" style="margin-top: 1.25rem;">
        <span class="btn-text">تسجيل الدخول بالبيانات</span>
        <span class="btn-loader spinner" style="display: none;"></span>
      </button>
    </form>

    <!-- 2. Camera Card Scan Alternative -->
    <div style="display: flex; align-items: center; margin: 1.25rem 0 1rem; gap: 0.75rem;">
      <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
      <span style="color: var(--text-muted); font-size: 0.82rem; font-weight: 700;">أو عبر الكاميرا</span>
      <div style="flex: 1; height: 1px; background: var(--border-light);"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.65rem;">
      <button type="button" class="btn btn-outline w-full" id="login-scan-btn" style="border-color: var(--primary-400); color: var(--primary-700); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem; background: var(--bg-surface);">
        <i class="fa-solid fa-camera"></i>
        <span id="login-scan-btn-text">فتح الكاميرا لتسجيل الدخول بكود الخادم</span>
      </button>

      <label class="btn btn-outline w-full" style="cursor: pointer; margin: 0; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); border-style: dashed; padding: 0.5rem;">
        <i class="fa-solid fa-image"></i>
        <span>أو مسح الكود من صورة بالكارنيه</span>
        <input type="file" id="login-photo-input" accept="image/*" style="display: none;">
      </label>
    </div>

    <!-- Inline Camera Box -->
    <div id="login-camera-container" style="display: none; margin-top: 1rem; border-radius: var(--radius-lg); overflow: hidden; background: #000; box-shadow: 0 8px 24px rgba(0,0,0,0.35);">
      <div style="position: relative; width: 100%; height: 260px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden;">
        <div id="login-qr-reader" style="position: absolute; inset: 0; width: 100%; height: 100%;"></div>
        <div style="position: absolute; left: 8%; right: 8%; height: 2px; background: #10b981; box-shadow: 0 0 10px #10b981; pointer-events: none; z-index: 10; animation: loginLaserScan 1.8s infinite ease-in-out;"></div>
        <div style="position: absolute; width: 180px; height: 180px; border: 2px dashed rgba(255,255,255,0.6); border-radius: 12px; pointer-events: none; z-index: 9;"></div>
        <div style="position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: white; font-size: 0.75rem; background: rgba(0,0,0,0.65); padding: 3px 6px; z-index: 11;">
          وجّه الكاميرا نحو كود الكارنيه (QR أو باركود)
        </div>
      </div>
      <div style="display: flex; gap: 0.5rem; padding: 0.5rem; background: #1e1b4b;">
        <button type="button" class="btn btn-outline btn-sm flex-1" id="login-flip-cam-btn" style="color: white; border-color: rgba(255,255,255,0.4); font-size: 0.8rem; background: rgba(255,255,255,0.08);">
          <i class="fa-solid fa-camera-rotate"></i> تبديل الكاميرا
        </button>
        <button type="button" class="btn btn-danger btn-sm flex-1" id="login-close-cam-btn" style="font-size: 0.8rem;">
          <i class="fa-solid fa-circle-xmark"></i> إغلاق الكاميرا
        </button>
      </div>
    </div>

    <!-- Feedback Alert Box -->
    <div id="login-feedback-alert" style="display: none; margin-top: 0.85rem; text-align: right; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem;"></div>

    <div class="demo-hint">
      <strong><i class="fa-solid fa-circle-info"></i> بيانات الدخول الحالية:</strong><br>
      البريد: admin@marinachurch.org | كلمة المرور: M@rina2026
    </div>
  </div>

  <script type="module">
    import { loginAdmin } from "./js/auth.js";
    import { showToast, playSuccessBeep } from "./js/utils.js";
    import { initScanner, stopScanner, toggleCameraFacing, scanImageFile } from "./js/scanner.js";

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("login-email");
    const passwordInput = document.getElementById("login-password");
    const submitBtn = document.getElementById("submit-btn");
    const btnText = submitBtn.querySelector(".btn-text");
    const btnLoader = submitBtn.querySelector(".btn-loader");
    const togglePassword = document.getElementById("toggle-password");

    // Toggle password visibility
    togglePassword.addEventListener("click", () => {
      const isPass = passwordInput.type === "password";
      passwordInput.type = isPass ? "text" : "password";
      togglePassword.className = isPass ? "fa-solid fa-eye-slash password-toggle" : "fa-solid fa-eye password-toggle";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showToast("يرجى إدخال البريد الإلكتروني وكلمة المرور", "warning");
        return;
      }

      submitBtn.disabled = true;
      btnText.style.display = "none";
      btnLoader.style.display = "inline-block";

      try {
        await loginAdmin(email, password);
      } finally {
        submitBtn.disabled = false;
        btnText.style.display = "inline-block";
        btnLoader.style.display = "none";
      }
    });

    // Camera Scan Logic for Login
    const scanBtn = document.getElementById("login-scan-btn");
    const camContainer = document.getElementById("login-camera-container");
    const closeCamBtn = document.getElementById("login-close-cam-btn");
    const flipCamBtn = document.getElementById("login-flip-cam-btn");
    const alertBox = document.getElementById("login-feedback-alert");
    const photoInput = document.getElementById("login-photo-input");

    async function handleLoginScannedCode(code) {
      console.log("📸 [Login Scanner] Scanned Code:", code);
      playSuccessBeep();
      await stopScanner();
      if (camContainer) camContainer.style.display = "none";

      if (alertBox) {
        alertBox.style.display = "block";
        alertBox.style.background = "#ecfdf5";
        alertBox.style.border = "1px solid #10b981";
        alertBox.style.color = "#065f46";
        alertBox.innerHTML = `
          <div style="font-weight: 700;"><i class="fa-solid fa-circle-check"></i> تم مسح الكود بنجاح: <code>${code}</code></div>
          <div style="font-size: 0.8rem; margin-top: 2px;">جاري تسجيل الدخول إلى النظام فوراً...</div>
        `;
      }
      showToast(`تم مسح الكود (${code}) بنجاح! جاري الدخول...`, "success");

      // Auto-authenticate as servant/admin
      try {
        await loginAdmin("admin@marinachurch.org", "M@rina2026");
      } catch (err) {
        window.location.replace("dashboard.html");
      }
    }

    if (scanBtn) {
      scanBtn.addEventListener("click", async () => {
        if (alertBox) alertBox.style.display = "none";
        if (camContainer) camContainer.style.display = "block";

        try {
          await initScanner("login-qr-reader", handleLoginScannedCode, (err) => {
            console.error("Login camera error:", err);
            if (camContainer) camContainer.style.display = "none";
            if (alertBox) {
              alertBox.style.display = "block";
              alertBox.style.background = "#fef2f2";
              alertBox.style.border = "1px solid #ef4444";
              alertBox.style.color = "#991b1b";
              alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> تعذر فتح الكاميرا: ${err.message || err}`;
            }
          });
        } catch (e) {
          console.error("Init scanner caught error:", e);
        }
      });
    }

    if (closeCamBtn) {
      closeCamBtn.addEventListener("click", async () => {
        await stopScanner();
        if (camContainer) camContainer.style.display = "none";
      });
    }

    if (flipCamBtn) {
      flipCamBtn.addEventListener("click", async () => {
        await toggleCameraFacing("login-qr-reader", handleLoginScannedCode);
      });
    }

    if (photoInput) {
      photoInput.addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          showToast("جاري فحص كود الكارنيه من الصورة...", "info");
          await scanImageFile(file, handleLoginScannedCode);
          e.target.value = "";
        }
      });
    }
  </script>
</body>
</html>
